<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/output.css" />
    <title>Website project template</title>
</head>
<script>
    const loadComponents = (id, url, callback) => {
        fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
                if (callback) callback();
            });
    };
    window.onload = () => {
        loadComponents("header", "src/sections/header.html", () => {
            const mobileMenuButton = document.getElementById("mobile-menu-button");
            const mobileMenu = document.getElementById("mobile-menu");
            const closeMenuButton = document.getElementById("close-menu-button");
            const logo = document.querySelector(".relative");
            const langSelector = document.querySelector(".flex.flex-col.text-sm.font-semibold");
            function openMenu() {
                mobileMenu.classList.remove("hidden");
                mobileMenuButton.classList.add("hidden");
                logo.classList.add("hidden");
                langSelector.classList.add("hidden");
            }

            function closeMenu() {
                mobileMenu.classList.add("hidden");
                mobileMenuButton.classList.remove("hidden");
                logo.classList.remove("hidden");
                langSelector.classList.remove("hidden");
            }
            mobileMenuButton.addEventListener("click", openMenu);
            closeMenuButton.addEventListener("click", closeMenu);

            window.addEventListener("resize", function () {
                if (window.innerWidth >= 1024) {
                    mobileMenu.classList.add("hidden");
                    mobileMenuButton.classList.remove("hidden");
                    logo.classList.remove("hidden");
                    langSelector.classList.remove("hidden");
                }
            });


        });

        loadComponents("hero", "src/sections/hero.html", () => {
            const yellow = document.querySelector("#yellow");
            const pink = document.querySelector("#pink");
            const shapesContainer = document.getElementById('shapes-container');
            window.addEventListener("_", () => {
                const makeFixed = element => {
                    if (element.style.position !== "fixed") { // Apply only once to avoid reapplying styles
                        console.log('fixing, element: ' + element.id + ', position:', element.style.position);
                        const rect_c = element.getBoundingClientRect(); // Get its current position
                        const rect_p = shapesContainer.getBoundingClientRect();
                        const rect = {
                            top: rect_c.top - rect_p.top,
                            left: rect_c.left - rect_p.left,
                            right: rect_c.right - rect_p.right
                        };
                        element.style.position = "fixed";
                        element.style.top = `${rect.top}px`; // Keep it at the same position
                        element.style.left = `${rect.left}px`;
                        element.style.right = `${rect.right}px`;
                        element.style.width = `${element.offsetWidth}px`; // Preserve width
                        // element.style.height = `${rect.height}px`; // Preserve height
                    }
                };
                const makeUnfixed = element => {
                    if (element.style.position === "fixed") {
                        console.log('unfixing, element: ' + element.id + ', position:', element.style.position);
                        const rect_c = element.getBoundingClientRect(); // Get its current position
                        const rect_p = shapesContainer.getBoundingClientRect();
                        const rect = {
                            top: rect_c.top - rect_p.top,
                            left: rect_c.left - rect_p.left,
                            right: rect_c.right - rect_p.right
                        }
                        element.style.position = "absolute";
                        element.style.top = `${rect.top}px`; // Keep it at the same position
                        element.style.left = `${rect.left}px`;
                        element.style.right = `${rect.right}px`;
                        element.style.width = `${element.offsetWidth}px`; // Preserve width
                        element.style.height = `${rect.height}px`; // Preserve height
                    }

                };
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                console.log('height:', scrollTop);

                const breakPoints = [
                    { element: yellow, breakPoints: [280] },
                    { element: pink, breakPoints: [290] },
                ];
                for (const object of breakPoints) {
                    if (scrollTop >= Math.min(...object.breakPoints)) makeFixed(object.element);
                    else if (scrollTop < Math.min(...object.breakPoints)) makeUnfixed(object.element);
                }
            });

        });

        loadComponents("contact", "src/sections/contact.html");
        loadComponents("footer", "src/sections/footer.html");
    };
</script>

<body>
    <div id="header"></div>
    <div id="hero"></div>
    <div id="contact"></div>
    <div id="footer"></div>
</body>

</html>
